jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # atualizado

      - name: Configurar Python
        uses: actions/setup-python@v6   # atualizado
        with:
          python-version: "3.11"

      - name: Rodar consulta PNCP
        run: python pncp_educacao_municipios.py

      - name: Commit e push do resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add licitacoes-educacao-*.txt
          git diff --quiet --cached || git commit -m "Atualiza licitações Educação - municípios PR"
          git pull --rebase origin main
          git push
