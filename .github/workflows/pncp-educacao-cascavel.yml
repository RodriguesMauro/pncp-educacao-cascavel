name: Consulta PNCP - Educação Municípios PR

on:
#  schedule:
#    - cron: "0 9 * * *"
#  workflow_dispatch: {}

concurrency:
  group: pncp-educacao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar consulta PNCP
        run: python pncp_educacao_municipios.py

      - name: Commit e push do resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add licitacoes-educacao-*.txt
          git diff --quiet --cached || git commit -m "Atualiza licitações Educação - municípios PR"
          git pull --rebase origin main
          git push
