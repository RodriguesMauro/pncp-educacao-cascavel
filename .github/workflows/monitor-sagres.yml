name: Monitor Sagres - oportunidades gestão educacional

on:
  workflow_dispatch: {}
  schedule:
    # 08h (Brasília) = 11 UTC, uma vez por dia, de segunda a sexta
    - cron: "0 11 * * 1-5"

concurrency:
  group: monitor-sagres
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # teto de custo: nunca passa de 10 min por rodada
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar monitor
        env:
          MONITOR_UFS: "PR"
          MONITOR_DIAS_RECENTES: "3"
          MONITOR_MAX_PAGINAS: "40"
        run: python monitor_sagres.py

      - name: Commit só se houve novidade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if [ -s reports/alerts.md ]; then git add reports/latest.md reports/alerts.md; fi
          git diff --quiet --cached || { git commit -m "Monitor Sagres: atualiza estado" && git pull --rebase origin main && git push; }

      - name: Abrir issue com os alertas (GitHub avisa por e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s reports/alerts.md ]; then
            gh issue create \
              --title "Monitor Sagres: alertas de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" \
              --body-file reports/alerts.md
          else
            echo "Sem novidades nesta execução."
          fi
