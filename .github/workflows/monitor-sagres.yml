name: Monitor Sagres - oportunidades gestão educacional

on:
  workflow_dispatch: {}
  schedule:
    # 08h, 12h, 16h e 20h (Brasília) = 11, 15, 19 e 23 UTC, de segunda a sábado
    - cron: "0 11,15,19,23 * * 1-6"

concurrency:
  group: monitor-sagres
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testes offline
        run: python tests/test_monitor_sagres.py

      - name: Rodar monitor
        env:
          MONITOR_UFS: "PR"
          MONITOR_DIAS_RECENTES: "3"
        run: python monitor_sagres.py

      - name: Commit do estado e relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json reports/latest.md reports/alerts.md
          git diff --quiet --cached || git commit -m "Monitor Sagres: atualiza estado e relatório"
          git pull --rebase origin main
          git push

      - name: Abrir issue com os alertas (GitHub avisa por e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s reports/alerts.md ]; then
            gh issue create \
              --title "Monitor Sagres: alertas de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" \
              --body-file reports/alerts.md
          else
            echo "Sem novidades nesta execução."
          fi
